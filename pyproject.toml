[project]
name = "ticket-triage-service"
version = "0.1.0"
description = "A minimal FastAPI ticket-triage service."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]
# Tests live next to the code in app/, so the shared fixtures in
# tests/conftest.py are loaded as a plugin rather than by directory.
addopts = ["-p", "tests.conftest"]

[tool.ruff]
target-version = "py312"
